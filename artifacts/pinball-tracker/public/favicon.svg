<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="TiltTrack">
  <!-- Matches the header logo: lucide's Trophy in the app's `primary` colour on the app background.
       The glyph is scaled to 0.85 about centre so it doesn't touch the tile edge, and the stroke is
       thickened from lucide's 2 to 2.6 because a 2px stroke turns to mush at 16px favicon size. -->
  <rect width="24" height="24" rx="5" fill="#09090B"/>
  <g transform="translate(12 12) scale(0.85) translate(-12 -12)"
     fill="none" stroke="#DD47EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
    <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
    <path d="M4 22h16"/>
    <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
    <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
    <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
  </g>
</svg>
